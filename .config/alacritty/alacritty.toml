[font]
size = 16.0

[window]
opacity = 0.9

[keyboard]
bindings = [
    { key = "Space", mods = "Shift", chars = "\u001b[32;2u" },
    { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
    { key = "K", mods = "Control", action = "ClearHistory" },
    # Russian layout equivalents of Ctrl+A..Z (standard ЙЦУКЕН).
    { key = "ф", mods = "Control", mode = "~Vi|~Search", chars = "\u0001" },
    { key = "и", mods = "Control", mode = "~Vi|~Search", chars = "\u0002" },
    { key = "с", mods = "Control", mode = "~Vi|~Search", chars = "\u0003" },
    { key = "в", mods = "Control", mode = "~Vi|~Search", chars = "\u0004" },
    { key = "у", mods = "Control", mode = "~Vi|~Search", chars = "\u0005" },
    { key = "а", mods = "Control", mode = "~Vi|~Search", chars = "\u0006" },
    { key = "п", mods = "Control", mode = "~Vi|~Search", chars = "\u0007" },
    { key = "р", mods = "Control", mode = "~Vi|~Search", chars = "\u0008" },
    { key = "ш", mods = "Control", mode = "~Vi|~Search", chars = "\u0009" },
    { key = "о", mods = "Control", mode = "~Vi|~Search", chars = "\u000a" },
    { key = "л", mods = "Control", action = "ClearHistory" },
    { key = "д", mods = "Control", mode = "~Vi|~Search", chars = "\u000c" },
    { key = "ь", mods = "Control", mode = "~Vi|~Search", chars = "\u000d" },
    { key = "т", mods = "Control", mode = "~Vi|~Search", chars = "\u000e" },
    { key = "щ", mods = "Control", mode = "~Vi|~Search", chars = "\u000f" },
    { key = "з", mods = "Control", mode = "~Vi|~Search", chars = "\u0010" },
    { key = "й", mods = "Control", mode = "~Vi|~Search", chars = "\u0011" },
    { key = "к", mods = "Control", mode = "~Vi|~Search", chars = "\u0012" },
    { key = "ы", mods = "Control", mode = "~Vi|~Search", chars = "\u0013" },
    { key = "е", mods = "Control", mode = "~Vi|~Search", chars = "\u0014" },
    { key = "г", mods = "Control", mode = "~Vi|~Search", chars = "\u0015" },
    { key = "м", mods = "Control", mode = "~Vi|~Search", chars = "\u0016" },
    { key = "ц", mods = "Control", mode = "~Vi|~Search", chars = "\u0017" },
    { key = "ч", mods = "Control", mode = "~Vi|~Search", chars = "\u0018" },
    { key = "н", mods = "Control", mode = "~Vi|~Search", chars = "\u0019" },
    { key = "я", mods = "Control", mode = "~Vi|~Search", chars = "\u001a" },
    { key = "С", mods = "Control|Shift", action = "Copy" },
    { key = "М", mods = "Control|Shift", action = "Paste" },
    { key = "Т", mods = "Control|Shift", action = "CreateNewWindow" },
]
